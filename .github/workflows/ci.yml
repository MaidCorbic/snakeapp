name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snakeapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify repository formatting
        run: git diff --check

      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check menu.js
          node --check ultimate-gameplay-v1.js
          node --check gameplay-update-v2.js
          node --check scripts/validate-game.cjs

      - name: Run deterministic regression validation
        run: node scripts/validate-game.cjs
