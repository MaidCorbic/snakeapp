name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snakeapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify repository formatting
        run: git diff --check

      - name: Install pinned browser-test tooling
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check menu.js
          node --check ultimate-gameplay-v1.js
          node --check gameplay-update-v2.js
          node --check arcade-polish-v1.js
          node --check snake-rework-v2.js
          node --check scripts/validate-game.cjs
          node --check scripts/stability-regression.cjs
          node --check playwright.config.cjs
          node --check tests/e2e/game.spec.cjs

      - name: Run deterministic regression validation
        run: |
          node scripts/validate-game.cjs
          node scripts/stability-regression.cjs

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e
