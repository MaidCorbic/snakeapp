name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check menu.js
          node --check ultimate-gameplay-v1.js
          node --check scripts/validate-game.cjs

      - name: Run integration and regression checks
        run: node scripts/validate-game.cjs
