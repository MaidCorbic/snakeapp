name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check menu.js

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
          test -f menu.js

      - name: Check standalone menu and gameplay hooks
        run: |
          grep -q 'id="bootMenu"' index.html
          grep -q 'id="bootStart"' index.html
          grep -q 'id="bootHow"' index.html
          grep -q 'id="bootOptions"' index.html
          grep -q 'id="game"' index.html
          grep -q 'id="start"' index.html
          grep -q 'id="dash"' index.html
          grep -q 'id="shield"' index.html
          grep -q 'id="pulse"' index.html
          grep -q 'id="fury"' index.html
          grep -q 'id="lives"' index.html
          grep -q 'id="xp"' index.html
          grep -q 'id="xpFill"' index.html
          grep -q 'id="danger"' index.html
          grep -q 'id="dangerFill"' index.html
          grep -q 'id="objective"' index.html
          grep -q 'id="objectiveFill"' index.html
          grep -q 'id="contract"' index.html
          grep -q 'id="contractFill"' index.html
          grep -q 'id="contractAccept"' index.html
          grep -q 'id="contractDecline"' index.html
          grep -q 'id="chainFill"' index.html
          grep -q 'id="extractionPanel"' index.html
          grep -q 'id="extractCashOut"' index.html
          grep -q 'id="upgradeList"' index.html
          grep -q 'id="achievementList"' index.html
          grep -q 'id="bootDaily"' index.html
          grep -q 'id="bootEndless"' index.html
          grep -q 'id="condition"' index.html
          grep -q 'id="runMode"' index.html
          grep -q 'id="evoPerk"' index.html
          grep -q 'id="maxThreat"' index.html
          grep -q 'id="leaderboardList"' index.html
          grep -q 'id="bootSound"' index.html
          grep -q 'id="bounty"' index.html
          grep -q 'id="perfectLabel"' index.html
          grep -q 'id="leaderboardList"' index.html
          grep -q 'id="dailyLeaderboardList"' index.html
          grep -q 'id="streakMark"' index.html
          grep -q 'id="mutation"' index.html
          grep -q 'id="mutationLabel"' index.html
          grep -q 'menu.js' index.html

      - name: Check gameplay hardening
        run: |
          grep -q 'window.SnakeEvolution' game.js
          grep -q 'showBootMenu' game.js
          grep -q 'function useFury' game.js
          grep -q 'function gainXp' game.js
          grep -q 'function takeDamage' game.js
          grep -q 'function selectObjective' game.js
          grep -q 'function checkObjective' game.js
          grep -q 'function handleZoneTransition' game.js
          grep -q 'function checkStreakRewards' game.js
          grep -q 'function checkContract' game.js
          grep -q 'function spawnSupplyDrop' game.js
          grep -q 'function cashOut' game.js
          grep -q 'function keepRunning' game.js
          grep -q 'function acceptContract' game.js
          grep -q 'function declineContract' game.js
          grep -q 'function checkAdvancedChain' game.js
          grep -q 'function registerAdvancedLoot' game.js
          grep -q 'function startAdvancedZoneEvent' game.js
          grep -q 'variant==="charger"' game.js
          grep -q 'variant==="charger"' ultimate-gameplay-v1.js
          grep -q 'variant==="watcher"' ultimate-gameplay-v1.js
          grep -q 'ONE CHANCE' ultimate-gameplay-v1.js
          grep -q 'NO MEDKITS' ultimate-gameplay-v1.js
          grep -q 'LOW VISIBILITY' ultimate-gameplay-v1.js
          grep -q 'DOUBLE DOWN' ultimate-gameplay-v1.js
          grep -q 'function enableDailyRng' ultimate-gameplay-v1.js
          grep -q 'function saveGhost' ultimate-gameplay-v1.js
          grep -q 'function saveLeaderboard' ultimate-gameplay-v1.js
          grep -q 'function spawnRiskShrine' ultimate-gameplay-v1.js
          grep -q 'function spawnSecretPortal' ultimate-gameplay-v1.js
          grep -q 'PERFECT x1.25' ultimate-gameplay-v1.js
          grep -q 'variant==="watcher"' game.js
          grep -q 'boss.hp<=6?3' game.js
          grep -q 'function buyUpgrade' game.js
          grep -q 'function checkAchievements' game.js
          grep -q 'ultimate-gameplay-v1.js' menu.js
          grep -q 'startDaily' ultimate-gameplay-v1.js
          grep -q 'startEndless' ultimate-gameplay-v1.js
          grep -q 'function generateArena' ultimate-gameplay-v1.js
          grep -q 'function addTelegraph' ultimate-gameplay-v1.js
          grep -q 'function saveLeaderboard' ultimate-gameplay-v1.js
          grep -q 'function spawnRiskShrine' ultimate-gameplay-v1.js
          grep -q 'function spawnSecretPortal' ultimate-gameplay-v1.js
          grep -q 'CHAIN FINISHER' ultimate-gameplay-v1.js
          grep -q 'PERFECT' ultimate-gameplay-v1.js
          grep -q 'AudioContext' ultimate-gameplay-v1.js
          grep -q 'const mutationDefs=' game.js
          grep -q 'function selectMutation' game.js
          grep -q 'function mutationName' game.js
          grep -q 'HUNTER ALERT' game.js
          grep -q 'HAZARD SHIFT' game.js
          grep -q 'SUPPLY RUSH' game.js
          grep -q 'OVERCLOCK' game.js
          grep -q 'function collectSupplyDrop' game.js
          grep -q 'supplyDropClock' game.js
          grep -q 'type==="elite"' game.js
          grep -q 'stats.elites' game.js
          grep -q 'danger=Math.min' game.js
          grep -q 'ctx.setTransform(canvas.width/COLS,0,0,canvas.height/ROWS,0,0)' game.js
          grep -q 'ctx.setTransform(canvas.width/COLS,0,0,canvas.height/ROWS,0,0)' game.js
          grep -q 'const missionDefs=' game.js
          grep -q 'APEX CORE' index.html
          grep -q 'FURY</b>' index.html

      - name: Check mobile controls
        run: |
          grep -q 'MOVE</b> WASD / ARROWS' index.html
          grep -q 'PHONE</b>' index.html
