<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b09">
<title>Snake Evolution — Survival Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
<header>
  <div><span class="eyebrow">PIXEL ARCADE // SURVIVAL RUN</span><h1>SNAKE <b>EVOLUTION</b></h1></div>
  <div class="stats">
    <span>SCORE <strong id="score">0</strong></span>
    <span>COMBO <strong id="combo">x1</strong></span>
    <span>TIME <strong id="time">5:00</strong></span>
    <span>BEST <strong id="best">0</strong></span>
  </div>
</header>
<section class="game-shell">
  <canvas id="game" aria-label="Snake Evolution game"></canvas>
  <div id="message" class="message">
    <h2>READY?</h2>
    <p>Survive five minutes. Chain pickups, use abilities and outlast the hunters.</p>
    <button id="start">START RUN</button>
  </div>
  <div id="toast" class="toast"></div>
</section>
<section class="ability-bar">
  <button id="dash" class="ability"><b>DASH</b><span>SPACE</span><i id="dashFill"></i></button>
  <button id="shield" class="ability"><b>SHIELD</b><span>SHIFT</span><i id="shieldFill"></i></button>
  <button id="pulse" class="ability"><b>PULSE</b><span>E</span><i id="pulseFill"></i></button>
</section>
<footer>
  <div class="legend">
    <span>■ ENERGY +10</span><span>◆ CORE +50</span><span>▲ HUNTER</span><span>■ HAZARD</span>
  </div>
  <div class="controls" aria-label="Mobile controls">
    <button data-dir="up">▲</button>
    <div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
  </div>
</footer>
</main>
<script src="game.js"></script>
</body>
</html>
